name: accumulo-privacy-demo

services:
  zookeeper:
    image: zookeeper:3.8.8-jre-17 # Keep the same tag as the first FROM in accumulo/Dockerfile.
    hostname: zookeeper
    volumes:
      - zk-data:/data
      - zk-datalog:/datalog
    healthcheck:
      test: ["CMD", "zkServer.sh", "status"]
      interval: 5s
      retries: 20

  hdfs:
    build: ./accumulo
    image: accumulo-privacy-demo/accumulo:local
    hostname: hdfs
    command: start-hdfs.sh
    volumes:
      - hdfs-data:/data
    healthcheck:
      test: ["CMD-SHELL", "hdfs dfsadmin -safemode get | grep -q OFF"]
      interval: 5s
      retries: 30

  accumulo:
    build: ./accumulo
    image: accumulo-privacy-demo/accumulo:local
    hostname: accumulo
    command: start-accumulo.sh
    depends_on:
      zookeeper: { condition: service_healthy }
      hdfs: { condition: service_healthy }
    stop_grace_period: 60s
    # The scan waits until the patients table is online, for example after a log replay.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready && accumulo shell -e 'scan -t patients -np -r p-0000'"]
      interval: 10s
      timeout: 60s
      start_period: 180s
      start_interval: 5s

  # Internal only: no ports are published to the host.
  gateway:
    build: ./gateway
    image: accumulo-privacy-demo/gateway:local
    environment:
      ACCUMULO_INSTANCE: demo
      ACCUMULO_ZOOKEEPERS: zookeeper:2181
      ACCUMULO_USER: gateway
      ACCUMULO_PASSWORD: demo-gateway # Demo only, set in accumulo/init.sh.
    depends_on:
      accumulo: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8081"]
      interval: 5s
      retries: 20

  # The public API. Bound to localhost only: there is no login, so do not expose it further.
  api:
    build: ./api
    image: accumulo-privacy-demo/api:local
    environment:
      GATEWAY_URL: http://gateway:8081
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/healthz"]
      interval: 5s
      retries: 20

  # One-shot job: `make seed` (and `make up`) runs it.
  seed:
    image: accumulo-privacy-demo/gateway:local
    command: ["java", "-cp", "/app/*", "gateway.Seed", "http://gateway:8081"]
    depends_on:
      gateway: { condition: service_healthy }
    profiles: [seed]

volumes:
  zk-data:
  zk-datalog:
  hdfs-data:
