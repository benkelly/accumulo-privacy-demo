# Weekly version updates. Each ecosystem opens one grouped PR.
# Major versions are ignored: the demo stays on Accumulo 2.1 LTS and Java 17.
version: 2
updates:
  - package-ecosystem: maven
    directory: /gateway
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      maven:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directories: [/accumulo, /api, /gateway, /web]
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    groups:
      docker:
        patterns: ["*"]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Its java launcher does not expand classpath wildcards. See accumulo/Dockerfile.
      - dependency-name: eclipse-temurin
        versions: ["17.0.21.1_2-jre-jammy"]

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
